name: Run ALL Check

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨 00:00 UTC 运行
  workflow_dispatch:

jobs:
  build-check-encode:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允许推送

    steps:
      # 1️⃣ 检出仓库
      - uses: actions/checkout@v4

      # 2️⃣ 安装系统依赖 & Node.js
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install bs58@4.0.1 axios
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py
        env:
          GH_TOKEN: ${{ secrets.TVCONFIG }}

      # 3️⃣ JSON 处理：生成 jingjian.json
      - name: Generate jingjian.json (strip _comment)
        run: |
          jq '{
            cache_time: .cache_time,
            api_site: (
              .api_site
              | with_entries(select(.value._comment | not))
            )
          }' input.json > jingjian.json

      - name: Validate jingjian.json
        run: jq empty jingjian.json

      # 4️⃣ JSON 处理：生成 jin18.json（去掉 adult）
      - name: Generate jin18.json (strip adult resources)
        run: |
          jq '{
            cache_time: .cache_time,
            api_site: (
              .api_site
              | with_entries(select(.value.name | startswith("🔞") | not))
            )
          }' jingjian.json > jin18.json

      - name: Validate jin18.json
        run: jq empty jin18.json

      # 5️⃣ Base58 编码
      - name: Encode JSON to Base58
        run: |
          cat > encode.js <<'EOF'
          const fs = require('fs');
          const bs58Module = require('bs58');
          const bs58 = (bs58Module && typeof bs58Module.encode === 'function')
            ? bs58Module
            : bs58Module.default;

          const files = [
            { input: 'input.json', output: 'input.txt' },
            { input: 'jingjian.json', output: 'jingjian.txt' },
            { input: 'jin18.json', output: 'jin18.txt' },
            { input: 'LunaTV-config.json', output: 'LunaTV-config.txt' },
            { input: 'output.json', output: 'output.txt' }
          ];

          files.forEach(file => {
            if (!fs.existsSync(file.input)) return;
            const data = fs.readFileSync(file.input);
            const encoded = bs58.encode(Buffer.from(data));
            fs.writeFileSync(file.output, encoded);
          });
          EOF

          node encode.js

      # 6️⃣ 运行 API 检查脚本
      - name: Run API check
        run: |
          API_NAME="${{ github.event.inputs.api_name || '逐玉' }}"
          echo "检查 API: $API_NAME"
          node check_api.js "$API_NAME"

      # 6️⃣.5 基于刚生成的报告，按「可搜索」过滤重新生成 Top20
      - name: Refine Top20 (searchable only)
        run: python refine_output.py

      # 7️⃣ 更新 README 或报告
      - name: Update report
        run: node update_readme.js

      # 8️⃣ 提交并推送所有生成文件（优化版）
      - name: Commit and push all generated files
        run: |
          # 配置 Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 拉取远程 main 分支，避免冲突
          git fetch origin main
          git reset --soft origin/main

          # 添加所有生成文件（含 main.py 产出的全量 output 与 Top20 精修结果）
          git add LunaTV-config.json LunaTV-config.txt \
                  output.json output.txt output_base58.txt \
                  output_top20.json output_top20_base58.txt \
                  jingjian.json jin18.json jingjian.txt jin18.txt \
                  report.md README.md input.json failed_apis.log github_sources.log

          # 提交更新，如果没有变化则输出提示
          git commit -m "自动更新 JSON、Base58 和 API 报告 ($(date -d '+8 hour' +'%Y-%m-%d %H:%M:%S CST'))" || echo "⚠️ 没有文件变化可提交"

          # 推送到远程 main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main


